<section class="cta-band on-dark" id="cta-band" aria-labelledby="cta-title">
  <div class="cta-band__mark">{{> seal}}</div>
  <div class="cta-band__in container">
    <h2 id="cta-title">{{cta_title}}</h2>
    <p class="cta-band__lead">{{cta_text}}</p>
    <div class="cta-band__actions">
      <a class="btn btn--gold" href="{{root}}kontakt/#zakazivanje">Zakažite u SB Feroni</a>
      <a class="btn btn--ghost-dark" href="{{g.ig_url}}" rel="noopener">Poruka na Instagramu</a>
    </div>
    <p class="cta-band__addr"><a href="{{g.tel_href}}">{{g.tel}}</a> &nbsp;·&nbsp; {{g.ferona}}, {{g.adresa}}</p>
    <p class="cta-band__sig">{{g.citat}}</p>
  </div>
</section>
