<style>
  :root { --c-primary:#0B3B46; --c-action:#0F766E; --c-action-hover:#115E59; --c-mint:#2DD4BF; --c-surface:#F8F9FA; --c-surface-soft:#EEF7F6; --c-border:#D4E2E0; --c-muted:#4B5563; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 20px; font-family:'Plus Jakarta Sans', system-ui, sans-serif; color:#111827; background:var(--c-surface); line-height:1.6; }
  main { max-width:560px; text-align:center; }
  .tab { display:inline-flex; flex-direction:column; width:84px; margin:0 auto 28px; }
  .tab span:first-child { margin:0 18px; padding:4px 0; border-radius:8px 8px 0 0; background:var(--c-primary); color:#fff; font-size:12px; font-weight:700; letter-spacing:.12em; }
  .tab span:last-child { height:92px; border-radius:6px 6px 40% 40% / 6px 6px 28% 28%; background:linear-gradient(180deg,#fff,var(--c-surface-soft)); border:1px solid var(--c-border); display:grid; place-items:center; font-size:28px; font-weight:700; color:var(--c-primary); box-shadow:inset 0 0 24px rgba(45,212,191,.3); }
  h1 { font-size:clamp(28px,4vw + 12px,40px); line-height:1.15; letter-spacing:-.02em; color:var(--c-primary); margin:0 0 12px; }
  p { color:var(--c-muted); margin:0 0 28px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn { display:inline-flex; align-items:center; min-height:48px; padding:12px 24px; border-radius:999px; font-weight:600; text-decoration:none; border:1.5px solid var(--c-primary); color:var(--c-primary); }
  a.btn:hover { background:var(--c-surface-soft); }
  a.btn--primary { background:var(--c-action); border-color:var(--c-action); color:#fff; }
  a.btn--primary:hover { background:var(--c-action-hover); }
  a:focus-visible { outline:2px solid var(--c-mint); outline-offset:2px; }
</style>
